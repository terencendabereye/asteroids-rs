[package]
name = "asteroids"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Asteroids with a class-like trait hierarchy, gamepad support and DualSense feedback"

[dependencies]
macroquad = { version = "0.4", default-features = false }
gilrs = "0.11"

# DualSense rumble / adaptive triggers over HID. No system libraries needed on Windows.
[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "2", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2", default-features = false, features = ["linux-native-basic-udev"] }

[profile.release]
opt-level = 3
